[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime (ระบบทำงานเบื้องหลัง)
tokio = { version = "1", features = ["full"] }

# Database Client
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "bigdecimal"] }

# HTTP Client (สำหรับยิงไป Binance/Bitkub)
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }

# JSON & Serialization (สำหรับแปลงค่าที่ได้มา)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Utilities
dotenv = "0.15"
rand = "0.8"        # <-- ตัวสุ่มเลข AI Score (ที่เคยขาด)
bigdecimal = "0.4"  # <-- ตัวคำนวณเงินทศนิยม (ที่เคยขาด)
anyhow = "1.0"      # <-- ตัวจัดการ Error (ที่เคยขาด)