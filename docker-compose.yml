services:
  # 1. ฐานข้อมูล (TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: crypto_app_development
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d crypto_app_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Rails App (Web)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    # command: สร้าง css -> เตรียม db -> รัน server
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails tailwindcss:build && bundle exec rails db:prepare && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://myuser:mypassword@db:5432/crypto_app_development
      RAILS_ENV: development

  # 3. Rust Worker
  worker:
    build:
      context: ./worker
      # แก้ไข: เปลี่ยนเป็น Dockerfile ธรรมดา (เพราะ Log ฟ้องว่าหา Dockerfile.worker ไม่เจอ)
      dockerfile: Dockerfile 
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://myuser:mypassword@db:5432/crypto_app_development

volumes:
  postgres_data: